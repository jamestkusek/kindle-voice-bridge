[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kindle-voice-bridge"
version = "0.1.0"
description = "Portable HTTP receiver for audio recordings sent from a Kindle voice bridge client."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
hci = ["bumble==0.0.236"]
test = [
    "pytest>=8.0,<9.0",
    "httpx>=0.27,<1.0",
    # Runs the KOReader Lua spec (tests/koreader/voicebridge_spec.lua).
    # The suite skips that test when lupa is not installed.
    "lupa>=2.0,<3.0",
]

[project.urls]
Repository = "https://github.com/jamestkusek/kindle-voice-bridge"

[tool.setuptools]
package-dir = { "" = "server" }

[tool.setuptools.packages.find]
where = ["server"]
include = ["voice_bridge_server*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["server"]
addopts = "-ra --strict-config"
norecursedirs = [".git", ".venv", "venv", "build", "dist", "*.egg-info"]
